# Name of your application. Used to uniquely configure containers.
service: shettar_business

# Name of the container image.
image: alexohre/shettar_business

# Deploy to these servers (same VPS as shettar-web / marketer / super).
servers:
  web:
    - 49.13.95.30

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
#
# DNS: point busn.shettar.com A → 49.13.95.30
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  hosts:
    - busn.shettar.com
  # Next.js standalone listens on 3000 (not 80). Local scripts still use 3001.
  app_port: 3000
  # public/up serves plain OK for kamal-proxy (works with static export + standalone).
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

deploy_timeout: 120
drain_timeout: 30

# Credentials for your image host (Docker Hub).
registry:
  username: alexohre
  password:
    - KAMAL_REGISTRY_PASSWORD

# Runtime process env (client NEXT_PUBLIC_* are baked at image build time via builder.args).
env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f

# Build on the remote VPS (same host as shettar-web / marketer / super).
# Values from .kamal/secrets — Kamal clones git and skips gitignored files.
builder:
  arch: amd64
  remote: ssh://root@49.13.95.30
  args:
    PNPM_VERSION: "10.33.0"
    NEXT_PUBLIC_API_URL: https://api-v1.shettar.com
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_WEB_URL: <%= ENV.fetch("NEXT_PUBLIC_WEB_URL", "https://shettar.com") %>
    NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: <%= ENV.fetch("NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY", "") %>
