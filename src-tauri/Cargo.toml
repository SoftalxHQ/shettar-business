[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-geolocation = "2"
# Patched transitive pins for Dependabot advisories
time = "0.3.47"
serde_with = "3.21.0"
# Tauri mobile uses reqwest with rustls-no-provider; install a process default in lib.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4"
tauri-plugin-biometric = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = "4"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
