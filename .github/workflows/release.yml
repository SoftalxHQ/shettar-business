name: "Publish Release"

on:
  push:
    tags:
      # Plain tags (e.g. v0.1.22) build PRODUCTION.
      # Tags suffixed with -staging (e.g. v0.1.22-staging) build STAGING.
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: write

jobs:
  prepare-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      api_url: ${{ steps.env.outputs.api_url }}
      app_env: ${{ steps.env.outputs.app_env }}
      paystack_public_key: ${{ steps.env.outputs.paystack_public_key }}
      tag_name: ${{ steps.env.outputs.tag_name }}
      release_name: ${{ steps.env.outputs.release_name }}
      prerelease: ${{ steps.env.outputs.prerelease }}
      version: ${{ steps.env.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Resolve target environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == *-staging ]]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          echo "Resolved environment: $ENVIRONMENT"

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          read_paystack_from_env_file() {
            local file="$1"
            if [ -f "$file" ]; then
              grep -E '^NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=' "$file" | head -1 | cut -d= -f2- | tr -d '\r'
            fi
          }

          if [ "$ENVIRONMENT" = "staging" ]; then
            PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY_STAGING }}"
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY }}"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="$(read_paystack_from_env_file .env.staging)"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              echo "::error::Paystack public key missing. Set PAYSTACK_PUBLIC_KEY_STAGING secret or NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY in .env.staging"
              exit 1
            fi
            {
              echo "api_url=https://api.stg.shettar.com"
              echo "app_env=staging"
              echo "paystack_public_key=$PAYSTACK_KEY"
              echo "tag_name=v${VERSION}-staging"
              echo "release_name=Shettar Business v${VERSION} (staging)"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          else
            PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY_PRODUCTION }}"
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY }}"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="$(read_paystack_from_env_file .env.production)"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              echo "::error::Paystack public key missing. Set PAYSTACK_PUBLIC_KEY_PRODUCTION secret or NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY in .env.production"
              exit 1
            fi
            {
              echo "api_url=https://api-v1.shettar.com"
              echo "app_env=production"
              echo "paystack_public_key=$PAYSTACK_KEY"
              echo "tag_name=v${VERSION}"
              echo "release_name=Shettar Business v${VERSION}"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.env.outputs.app_env }}
          TAG: ${{ steps.env.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.env.outputs.release_name }}
          PRERELEASE: ${{ steps.env.outputs.prerelease }}
          VERSION: ${{ steps.env.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force 2>/dev/null || true

          if [ "$CHANNEL" = "staging" ]; then
            PREV_TAG="$(git tag -l 'v*-staging' --sort=-v:refname | awk -v cur="$TAG" '$0 != cur { print; exit }')"
          else
            PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -v '\-staging$' | awk -v cur="$TAG" '$0 != cur { print; exit }')"
          fi

          {
            echo "## Shettar Business v${VERSION}"
            echo ""
            if [ "$CHANNEL" = "staging" ]; then
              echo "_Staging build — for testing only._"
              echo ""
            fi

            # Prepend curated highlights from RELEASE_NOTES.md when present for this version
            if [ -f RELEASE_NOTES.md ]; then
              HIGHLIGHTS="$(awk -v ver="$VERSION" '
                $0 == "## " ver {capture=1; next}
                /^## / {if (capture) exit}
                capture {print}
              ' RELEASE_NOTES.md | sed '/^$/d')"
              if [ -n "${HIGHLIGHTS:-}" ]; then
                echo "$HIGHLIGHTS"
                echo ""
              fi
            fi

            echo "### Changes"
            echo ""
            if [ -n "${PREV_TAG:-}" ]; then
              echo "Compared to \`${PREV_TAG}\`:"
              echo ""
              git log --pretty=format:'- %s' "${PREV_TAG}..HEAD" | sed '/^$/d'
              echo ""
            else
              echo "- See commit history on \`main\`"
              echo ""
            fi
            echo "### Installers"
            echo ""
            echo "- macOS (Apple Silicon + Intel)"
            echo "- Windows"
            echo "- Linux (AppImage, .deb, .rpm)"
            echo "- Android (APK)"
            echo "- iOS (App Store / TestFlight)"
            echo ""
            echo "Configure a thermal receipt printer under **Settings → Printer** after installing."
          } > /tmp/release-notes.md

          echo "Release notes (prev=${PREV_TAG:-none}):"
          cat /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes"
            gh release edit "$TAG" --title "$RELEASE_NAME" --notes-file /tmp/release-notes.md
          else
            PRE_ARGS=()
            if [ "$PRERELEASE" = "true" ]; then
              PRE_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" \
              --title "$RELEASE_NAME" \
              --notes-file /tmp/release-notes.md \
              "${PRE_ARGS[@]}"
          fi

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Must match src-tauri/rust-toolchain.toml so targets land on the toolchain cargo uses
          toolchain: "1.88.0"
          # Those targets are only used on macos runners so it's skip on linux and windows
          targets: ${{ matrix.platform == 'macos-latest' && (contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || '') || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install

      - name: Configure updater endpoint for environment
        env:
          NEXT_PUBLIC_APP_ENV: ${{ needs.prepare-release.outputs.app_env }}
          NEXT_PUBLIC_API_URL: ${{ needs.prepare-release.outputs.api_url }}
        run: pnpm configure:updater

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # API URL + env are baked into the static Next.js export at build time.
          NEXT_PUBLIC_API_URL: ${{ needs.prepare-release.outputs.api_url }}
          NEXT_PUBLIC_APP_ENV: ${{ needs.prepare-release.outputs.app_env }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ needs.prepare-release.outputs.paystack_public_key }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Release already created by prepare-release; tauri-action uploads assets to it.
          # Use literal tag (no __VERSION__) so it matches the prepared release exactly.
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: ${{ needs.prepare-release.outputs.release_name }}
          releaseBody: "See release notes."
          releaseDraft: false
          prerelease: ${{ needs.prepare-release.outputs.prerelease }}
          args: ${{ matrix.args }}

  publish-android:
    name: Build Android APK
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install

      - name: Configure updater endpoint for environment
        env:
          NEXT_PUBLIC_APP_ENV: ${{ needs.prepare-release.outputs.app_env }}
          NEXT_PUBLIC_API_URL: ${{ needs.prepare-release.outputs.api_url }}
        run: pnpm configure:updater

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APK may be unsigned"
            exit 0
          fi
          mkdir -p src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/shettar-business-release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/shettar-business-release.keystore
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storePassword=${ANDROID_STORE_PASSWORD}
          EOF
          # Strip accidental leading whitespace from heredoc lines
          sed -i 's/^[[:space:]]*//' src-tauri/gen/android/keystore.properties
      - name: Ensure Android project exists
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci
          fi

      - name: Build Android APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ needs.prepare-release.outputs.api_url }}
          NEXT_PUBLIC_APP_ENV: ${{ needs.prepare-release.outputs.app_env }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ needs.prepare-release.outputs.paystack_public_key }}
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: pnpm tauri android build --apk --ci

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found after Android build"
            exit 1
          fi
          DEST="Shettar-Business_${VERSION}_android.apk"
          cp "$APK" "$DEST"
          gh release upload "$TAG" "$DEST" --clobber

  publish-ios:
    name: Build iOS IPA
    needs: prepare-release
    runs-on: macos-latest
    # Desktop + Android registration must not fail if Apple signing is unset or iOS build flakes.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Check Apple signing secrets
        id: ios_creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_PROVISIONING_PROFILE:-}" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping iOS IPA build — APPLE_CERTIFICATE / APPLE_PROVISIONING_PROFILE not set. Desktop and Android release continue."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ios_creds.outputs.has_creds == 'true'

      - name: setup node
        if: steps.ios_creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        if: steps.ios_creds.outputs.has_creds == 'true'
        uses: pnpm/action-setup@v4

      - name: install Rust
        if: steps.ios_creds.outputs.has_creds == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        if: steps.ios_creds.outputs.has_creds == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        if: steps.ios_creds.outputs.has_creds == 'true'
        run: pnpm install

      - name: Configure updater endpoint for environment
        if: steps.ios_creds.outputs.has_creds == 'true'
        env:
          NEXT_PUBLIC_APP_ENV: ${{ needs.prepare-release.outputs.app_env }}
          NEXT_PUBLIC_API_URL: ${{ needs.prepare-release.outputs.api_url }}
        run: pnpm configure:updater

      - name: Ensure iOS project exists
        if: steps.ios_creds.outputs.has_creds == 'true'
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            pnpm tauri ios init --ci
          fi

      - name: Import Apple signing materials
        if: steps.ios_creds.outputs.has_creds == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/build_certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 -d > "$PROFILE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Build iOS IPA
        if: steps.ios_creds.outputs.has_creds == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ needs.prepare-release.outputs.api_url }}
          NEXT_PUBLIC_APP_ENV: ${{ needs.prepare-release.outputs.app_env }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ needs.prepare-release.outputs.paystack_public_key }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm tauri ios build --ci

      - name: Upload IPA to GitHub Release
        if: steps.ios_creds.outputs.has_creds == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$(find src-tauri/gen/apple -name '*.ipa' -type f | head -1)"
          if [ -z "$IPA" ]; then
            echo "::warning::No IPA found after iOS build"
            exit 0
          fi
          DEST="Shettar-Business_${VERSION}_ios.ipa"
          cp "$IPA" "$DEST"
          gh release upload "$TAG" "$DEST" --clobber

      - name: Upload IPA to App Store Connect
        if: steps.ios_creds.outputs.has_creds == 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY:-}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "App Store Connect secrets not set — skipping upload"
            exit 0
          fi
          IPA="Shettar-Business_${VERSION}_ios.ipa"
          if [ ! -f "$IPA" ]; then
            echo "No IPA to upload"
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > "$KEY_PATH"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" || \
            echo "::warning::App Store Connect upload failed or altool unavailable"

  register-release:
    name: Register release with Rails API
    needs: [prepare-release, publish-tauri, publish-android, publish-ios]
    # Proceed when desktop/android succeed even if iOS was skipped or failed (continue-on-error).
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.publish-tauri.result == 'success' &&
      needs.publish-android.result == 'success' &&
      (needs.publish-ios.result == 'success' || needs.publish-ios.result == 'failure' || needs.publish-ios.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve channel + API
        id: env
        shell: bash
        run: |
          ENVIRONMENT="${{ needs.prepare-release.outputs.app_env }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$ENVIRONMENT" = "staging" ]; then
            {
              echo "channel=staging"
              echo "api_url=https://api.stg.shettar.com"
              echo "tag=v${VERSION}-staging"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=production"
              echo "api_url=https://api-v1.shettar.com"
              echo "tag=v${VERSION}"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Registering $ENVIRONMENT release v$VERSION"

      - name: Map GitHub assets and POST to Rails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DESKTOP_RELEASE_CI_TOKEN: ${{ secrets.DESKTOP_RELEASE_CI_TOKEN }}
          API_URL: ${{ steps.env.outputs.api_url }}
          CHANNEL: ${{ steps.env.outputs.channel }}
          VERSION: ${{ steps.env.outputs.version }}
          TAG: ${{ steps.env.outputs.tag }}
          BUSINESS_IOS_STORE_URL: ${{ secrets.BUSINESS_IOS_STORE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_RELEASE_CI_TOKEN:-}" ]; then
            echo "::error::DESKTOP_RELEASE_CI_TOKEN secret is not set"
            exit 1
          fi
          chmod +x scripts/register-desktop-release.sh
          ./scripts/register-desktop-release.sh
