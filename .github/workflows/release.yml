name: "Publish Release"

on:
  push:
    tags:
      # Plain tags (e.g. v0.1.22) build PRODUCTION.
      # Tags suffixed with -staging (e.g. v0.1.22-staging) build STAGING.
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - production
          - staging
        default: production

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's skip on linux and windows
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install

      - name: Resolve target environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == *-staging ]]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          echo "Resolved environment: $ENVIRONMENT"

          read_paystack_from_env_file() {
            local file="$1"
            if [ -f "$file" ]; then
              grep -E '^NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=' "$file" | head -1 | cut -d= -f2- | tr -d '\r'
            fi
          }

          if [ "$ENVIRONMENT" = "staging" ]; then
            PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY_STAGING }}"
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY }}"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="$(read_paystack_from_env_file .env.staging)"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              echo "::error::Paystack public key missing. Set PAYSTACK_PUBLIC_KEY_STAGING secret or NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY in .env.staging"
              exit 1
            fi
            {
              echo "api_url=https://api.stg.shettar.com"
              echo "app_env=staging"
              echo "paystack_public_key=$PAYSTACK_KEY"
              echo "tag_name=v__VERSION__-staging"
              echo "release_name=Shettar Business v__VERSION__ (staging)"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          else
            PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY_PRODUCTION }}"
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="${{ secrets.PAYSTACK_PUBLIC_KEY }}"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              PAYSTACK_KEY="$(read_paystack_from_env_file .env.production)"
            fi
            if [ -z "$PAYSTACK_KEY" ]; then
              echo "::error::Paystack public key missing. Set PAYSTACK_PUBLIC_KEY_PRODUCTION secret or NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY in .env.production"
              exit 1
            fi
            {
              echo "api_url=https://api-v1.shettar.com"
              echo "app_env=production"
              echo "paystack_public_key=$PAYSTACK_KEY"
              echo "tag_name=v__VERSION__"
              echo "release_name=Shettar Business v__VERSION__"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Configure updater endpoint for environment
        env:
          NEXT_PUBLIC_APP_ENV: ${{ steps.env.outputs.app_env }}
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.api_url }}
        run: pnpm configure:updater

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force 2>/dev/null || true
          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL="${{ steps.env.outputs.app_env }}"

          if [ "$CHANNEL" = "staging" ]; then
            CURRENT_TAG="v${VERSION}-staging"
            PREV_TAG="$(git tag -l 'v*-staging' --sort=-v:refname | awk -v cur="$CURRENT_TAG" '$0 != cur { print; exit }')"
          else
            CURRENT_TAG="v${VERSION}"
            PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -v '\-staging$' | awk -v cur="$CURRENT_TAG" '$0 != cur { print; exit }')"
          fi

          {
            echo "## Shettar Business v${VERSION}"
            echo ""
            if [ "$CHANNEL" = "staging" ]; then
              echo "_Staging build — for testing only._"
              echo ""
            fi
            echo "### Changes"
            echo ""
            if [ -n "${PREV_TAG:-}" ]; then
              echo "Compared to \`${PREV_TAG}\`:"
              echo ""
              git log --pretty=format:'- %s' "${PREV_TAG}..HEAD" | sed '/^$/d'
              echo ""
            else
              echo "- See commit history on \`main\`"
              echo ""
            fi
            echo "### Installers"
            echo ""
            echo "- macOS (Apple Silicon + Intel)"
            echo "- Windows"
            echo "- Linux (AppImage, .deb, .rpm)"
            echo ""
            echo "Configure a thermal receipt printer under **Settings → Printer** after installing."
          } > /tmp/release-notes.md

          {
            echo "body<<EOF"
            cat /tmp/release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Generated release notes (prev=${PREV_TAG:-none}):"
          cat /tmp/release-notes.md

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # API URL + env are baked into the static Next.js export at build time.
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.api_url }}
          NEXT_PUBLIC_APP_ENV: ${{ steps.env.outputs.app_env }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ steps.env.outputs.paystack_public_key }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.env.outputs.tag_name }} # tauri-action replaces __VERSION__ with the app version
          releaseName: ${{ steps.env.outputs.release_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.env.outputs.prerelease }}
          args: ${{ matrix.args }}

  register-release:
    name: Register release with Rails API
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve channel + API
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == *-staging ]]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="production"
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if [ "$ENVIRONMENT" = "staging" ]; then
            {
              echo "channel=staging"
              echo "api_url=https://api.stg.shettar.com"
              echo "tag=v${VERSION}-staging"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=production"
              echo "api_url=https://api-v1.shettar.com"
              echo "tag=v${VERSION}"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Registering $ENVIRONMENT release v$VERSION"

      - name: Map GitHub assets and POST to Rails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DESKTOP_RELEASE_CI_TOKEN: ${{ secrets.DESKTOP_RELEASE_CI_TOKEN }}
          API_URL: ${{ steps.env.outputs.api_url }}
          CHANNEL: ${{ steps.env.outputs.channel }}
          VERSION: ${{ steps.env.outputs.version }}
          TAG: ${{ steps.env.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_RELEASE_CI_TOKEN:-}" ]; then
            echo "::error::DESKTOP_RELEASE_CI_TOKEN secret is not set"
            exit 1
          fi
          chmod +x scripts/register-desktop-release.sh
          ./scripts/register-desktop-release.sh
